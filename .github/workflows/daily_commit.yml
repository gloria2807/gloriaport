name: Gloria's Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create file and commit
        run: |
          FILE="commit_number.md"

          if [ ! -f "$FILE" ]; then
            echo "Hello, my name is Gloria Enyi" > "$FILE"
            echo "commit number: 1" >> "$FILE"
          else
            CURRENT_COUNT=$(grep -oP 'commit number: \K\d+' "$FILE" || echo "0")
            NEXT_COUNT=$((CURRENT_COUNT + 1))
            sed -i "/commit number: /c\commit number: $NEXT_COUNT" "$FILE"
          fi

          git config user.name "gloria2807"
          git config user.email "nkemaconam@gmail.com"

          git add "$FILE"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Daily commit #${CURRENT_COUNT:-1}"
          git push origin main
